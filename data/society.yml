# Society structure: the single source of truth the site renders.
# Edited only here, via GitHub; a merged change redeploys the site.
# List order = render order everywhere.

society:
  name: Oxford Quantitative Trading Society
  short_name: OQTS
  email: oqts@oqts.org
  links:
    linkedin: ""   # add profile URLs when live; empty entries are not rendered
    instagram: ""

# Every person below also takes optional profile fields:
#   links: { linkedin: "https://..." }   # rendered in the open profile
# (year: is also supported but currently unused; cards read more compact
# without it and it would need bumping every Michaelmas)
#
# BIO AND COURSE ARE NOT HERE ANY MORE (moved 2026-09-04). Each person
# writes their own description and degree on the platform, at
# platform.oqts.org/account, and the site fetches them through
# lib/team.ts: the same move events made on 2026-09-01, so that fixing
# your own paragraph, or saying you have graduated, is not a pull
# request. Both fields added back into this file will simply not be read.
#
# What stays here is what the society decides rather than the person:
# who is on the team, their committee role, their links, and the order
# they appear in.
